version: "3.8"

services:
  booking-app:
    build: .
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/booking"]
      interval: 30s
      timeout: 10s
      retries: 3
