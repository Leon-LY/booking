# Nginx configuration for /booking sub-path
#
# Add this location block INSIDE the existing server block that listens on port 80
# (or whatever port users access). On this server, that's /etc/nginx/sites-available/portfolio
#
# The server block should look like:
# server {
#     listen 80;
#     server_name 49.232.49.175;
#     ...

    # Booking app proxy
    location /booking {
        proxy_pass http://127.0.0.1:3002/booking;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

# Deploy steps:
# 1. Create database:
#    docker exec -it investlearn-db psql -U investlearn -c "CREATE DATABASE booking_app;"
#
# 2. Upload code to /opt/booking/
# 3. Create .env.production with DATABASE_URL and NEXTAUTH_SECRET
# 4. docker compose up --build -d
# 5. Push schema: docker exec booking-booking-app-1 node node_modules/prisma/build/index.js db push
# 6. Insert seed data via SQL (see prisma/seed.ts)
# 7. Add this location block to existing nginx port 80 server config
# 8. nginx -t && nginx -s reload
# 9. Visit http://49.232.49.175/booking
